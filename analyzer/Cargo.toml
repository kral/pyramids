[package]
name = "vto"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
default-run = "vto"

[dependencies]
base64 = "0.23.1"
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-normalization = "0.1"
sha2 = "0.11.1"

[dev-dependencies]
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }

[profile.release]
lto = "thin"
codegen-units = 4
