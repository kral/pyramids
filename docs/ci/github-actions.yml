# vto in YOUR project's CI – GitHub Actions template.      (print it with: vto ci github)
#
# What it does
#   push to main   full run with the collector → coverage map published as an artifact
#   pull request   only the tests affected by the PR (falls back to the whole suite whenever the
#                  map cannot answer: no map yet, stale map, config/lockfile change, exit code 3)
#   nightly        whole suite in isolated forks + vitest-guard verify (only if you use vitest-guard)
#
# Trust rule: the map is recorded only on the protected branch. A PR consumes the map, it never
# produces one (FORMAT.md, "Map provenance").
#
# Before you use it
#   1. Replace <OWNER>/<VTO_REPO> and <VTO_SHA> (a commit SHA of vto you reviewed; not a branch).
#   2. Pin every action by commit SHA (the tags below are placeholders – resolve them once with
#      `gh api repos/actions/checkout/commits/v4 --jq .sha` and keep the tag as a comment).
#   3. vto is not on npm yet, so the template checks it out and builds the analyzer (Rust, ≈ 40 s
#      with a warm cache). When prebuilt packages exist the "set up vto" steps become `npm ci`.
name: tests
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: '17 2 * * *' }]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  VTO_HOME: ${{ github.workspace }}/.vto-tool
jobs:
  map:                                    # main only: full run, record and publish the map
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4         # pin by SHA
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4       # pin by SHA
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # --- set up vto (until it is an npm package) ---
      - uses: actions/checkout@v4         # pin by SHA
        with: { repository: <OWNER>/<VTO_REPO>, ref: <VTO_SHA>, path: .vto-tool, persist-credentials: false }
      - run: npm ci --ignore-scripts
        working-directory: .vto-tool
      - run: cargo build --locked --release --manifest-path .vto-tool/analyzer/Cargo.toml
      # --- full run with the collector; exit code = Vitest's ---
      - run: node "$VTO_HOME/bin/vto.mjs" map record .vto-raw
      - run: node "$VTO_HOME/bin/vto.mjs" map pack .vto-raw --out vto-map.jsonl
      - uses: actions/upload-artifact@v4  # pin by SHA
        with: { name: vto-map, path: vto-map.jsonl, retention-days: 30 }

  affected:                               # pull requests: affected tests only
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read                       # to download the map artifact of the main branch
    steps:
      - uses: actions/checkout@v4         # pin by SHA
        with: { fetch-depth: 0, persist-credentials: false }   # the diff needs the merge base
      - uses: actions/setup-node@v4       # pin by SHA
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/checkout@v4         # pin by SHA
        with: { repository: <OWNER>/<VTO_REPO>, ref: <VTO_SHA>, path: .vto-tool, persist-credentials: false }
      - run: npm ci --ignore-scripts
        working-directory: .vto-tool
      - run: cargo build --locked --release --manifest-path .vto-tool/analyzer/Cargo.toml
      - name: download the map recorded on the base branch (missing map = full run)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          run_id=$(gh run list --workflow tests.yml --branch "$BASE_REF" --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$run_id" ]; then gh run download "$run_id" --name vto-map --dir . || echo "no map artifact – full run"; fi
      - name: affected tests (same command on every OS – no xargs)
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node "$VTO_HOME/docs/ci/run-affected.mjs" --map vto-map.jsonl --base "origin/$BASE_REF"

  nightly:                                # the whole suite, isolated; vitest-guard users also verify the fast mode
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4         # pin by SHA
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4       # pin by SHA
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx --no-install vitest run
        env: { VITEST_GUARD_MODE: isolated }  # no effect unless vitest.config is wrapped with defineVitestGuardConfig
      # Only with vitest-guard (exit 5 = false green, exit 4 = quarantine changed: commit it):
      # - uses: actions/checkout@v4
      #   with: { repository: <OWNER>/<VTO_REPO>, ref: <VTO_SHA>, path: .vto-tool, persist-credentials: false }
      # - run: node "$VTO_HOME/bin/vto.mjs" guard verify --sample 500
      # - run: node "$VTO_HOME/bin/vto.mjs" guard check --prune
