# vto in YOUR project's CI – Azure Pipelines template.      (print it with: vto ci azure)
#
#   main          full run with the collector → coverage map published as a pipeline artifact
#   pull request  only the tests affected by the PR; whole suite whenever the map cannot answer
#   nightly       whole suite in isolated forks (+ vitest-guard verify if you use vitest-guard)
#
# Trust rule: the map is recorded only on the protected branch; PR builds only consume it.
#
# Before you use it
#   1. Declare the vto repository as a resource (below) and pin `ref` to a commit you reviewed.
#   2. vto is not on npm yet: the template checks it out and builds the analyzer. Microsoft-hosted
#      images ship Rust; a self-hosted agent needs rustup (Windows: MSVC Build Tools).
#   3. PR validation for Azure Repos is configured by a branch policy, not by the `pr:` key.
trigger: { branches: { include: [main] } }
pr: { branches: { include: ['*'] } }
schedules:
  - cron: '17 2 * * *'
    displayName: nightly isolated
    branches: { include: [main] }
    always: true

resources:
  repositories:
    - repository: vto
      type: github                       # or `git` for Azure Repos: name: <Project>/<vto repo>
      endpoint: <SERVICE_CONNECTION>
      name: <OWNER>/<VTO_REPO>
      ref: <VTO_SHA>

variables:
  npm_config_cache: $(Pipeline.Workspace)/.npm
  VTO_HOME: $(Build.SourcesDirectory)/vto

# Multi-repo checkout puts each repository in its own folder: <sources>/app and <sources>/vto.
# The "set up" steps are repeated in every job on purpose (Azure Pipelines has no YAML anchors;
# move them into a steps template file if you prefer).
stages:
  - stage: test
    jobs:
      - job: map
        displayName: full run + record the map (main)
        condition: and(eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'Schedule'), ne(variables['Build.Reason'], 'PullRequest'))
        pool: { vmImage: ubuntu-latest }
        steps:
          - checkout: self
            path: s/app
            fetchDepth: 0                        # the diff needs the merge base (new pipelines default to a shallow fetch)
            persistCredentials: false
          - checkout: vto
            path: s/vto
            persistCredentials: false
          - task: UseNode@1
            inputs: { version: '22.x' }
          - task: Cache@2
            inputs: { key: 'npm | "$(Agent.OS)" | $(Build.SourcesDirectory)/app/package-lock.json', path: $(npm_config_cache) }
          - script: npm ci
            workingDirectory: $(Build.SourcesDirectory)/app
            displayName: npm ci (project)
          - script: npm ci --ignore-scripts
            workingDirectory: $(VTO_HOME)
            displayName: npm ci (vto)
          - script: cargo build --locked --release --manifest-path "$(VTO_HOME)/analyzer/Cargo.toml"
            displayName: build the vto analyzer
          - script: node "$(VTO_HOME)/bin/vto.mjs" map record .vto-raw
            workingDirectory: $(Build.SourcesDirectory)/app
            displayName: tests with the collector
          - script: node "$(VTO_HOME)/bin/vto.mjs" map pack .vto-raw --out "$(Build.ArtifactStagingDirectory)/vto-map.jsonl"
            workingDirectory: $(Build.SourcesDirectory)/app
            displayName: pack the map
          - publish: $(Build.ArtifactStagingDirectory)/vto-map.jsonl
            artifact: vto-map

      - job: affected
        displayName: affected tests (PR)
        condition: eq(variables['Build.Reason'], 'PullRequest')
        strategy:
          matrix:
            linux: { image: ubuntu-latest }
            windows: { image: windows-latest }
            mac: { image: macOS-latest }
        pool: { vmImage: $(image) }
        steps:
          - checkout: self
            path: s/app
            fetchDepth: 0                        # the diff needs the merge base (new pipelines default to a shallow fetch)
            persistCredentials: false
          - checkout: vto
            path: s/vto
            persistCredentials: false
          - task: UseNode@1
            inputs: { version: '22.x' }
          - task: Cache@2
            inputs: { key: 'npm | "$(Agent.OS)" | $(Build.SourcesDirectory)/app/package-lock.json', path: $(npm_config_cache) }
          - script: npm ci
            workingDirectory: $(Build.SourcesDirectory)/app
            displayName: npm ci (project)
          - script: npm ci --ignore-scripts
            workingDirectory: $(VTO_HOME)
            displayName: npm ci (vto)
          - script: cargo build --locked --release --manifest-path "$(VTO_HOME)/analyzer/Cargo.toml"
            displayName: build the vto analyzer
          - task: DownloadPipelineArtifact@2
            displayName: map of the main branch (missing map = full run)
            continueOnError: true
            inputs:
              source: specific
              project: $(System.TeamProjectId)
              pipeline: $(System.DefinitionId)
              runVersion: latestFromBranch
              runBranch: refs/heads/main
              artifact: vto-map
              path: $(Pipeline.Workspace)/vto-map
          - pwsh: |
              # System.PullRequest.TargetBranch is "refs/heads/x" on Azure Repos and "x" for GitHub repositories
              $base = "origin/" + ($env:TARGET_BRANCH -replace '^refs/heads/', '')
              node "$env:VTO_HOME/docs/ci/run-affected.mjs" --map "$(Pipeline.Workspace)/vto-map/vto-map.jsonl" --base $base
              exit $LASTEXITCODE
            env: { TARGET_BRANCH: $(System.PullRequest.TargetBranch) }
            workingDirectory: $(Build.SourcesDirectory)/app
            displayName: affected tests (pwsh on every OS – no xargs)

      - job: nightly
        displayName: whole suite, isolated
        condition: eq(variables['Build.Reason'], 'Schedule')
        pool: { vmImage: ubuntu-latest }
        steps:
          - checkout: self
            path: s/app
            fetchDepth: 0                        # the diff needs the merge base (new pipelines default to a shallow fetch)
            persistCredentials: false
          - checkout: vto
            path: s/vto
            persistCredentials: false
          - task: UseNode@1
            inputs: { version: '22.x' }
          - task: Cache@2
            inputs: { key: 'npm | "$(Agent.OS)" | $(Build.SourcesDirectory)/app/package-lock.json', path: $(npm_config_cache) }
          - script: npm ci
            workingDirectory: $(Build.SourcesDirectory)/app
            displayName: npm ci (project)
          - script: npm ci --ignore-scripts
            workingDirectory: $(VTO_HOME)
            displayName: npm ci (vto)
          - script: cargo build --locked --release --manifest-path "$(VTO_HOME)/analyzer/Cargo.toml"
            displayName: build the vto analyzer
          - script: npx --no-install vitest run
            workingDirectory: $(Build.SourcesDirectory)/app
            env: { VITEST_GUARD_MODE: isolated }   # no effect unless vitest.config is wrapped with defineVitestGuardConfig
          # Only with vitest-guard (exit 5 = false green, exit 4 = quarantine changed: commit it):
          # - script: node "$(VTO_HOME)/bin/vto.mjs" guard verify --sample 500
          #   workingDirectory: $(Build.SourcesDirectory)/app
          # - script: node "$(VTO_HOME)/bin/vto.mjs" guard check --prune
          #   workingDirectory: $(Build.SourcesDirectory)/app
