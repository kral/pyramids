# vto CI. Every job runs steps of .github/scripts/ci.mjs, so `node .github/scripts/ci.mjs all`
# on a developer machine runs exactly what CI runs.
#
#   lint       node --check on every script, repo hygiene (samples, pinned actions, docs)
#   analyzer   cargo test + release build on 5 targets, packed as @jirikral/vto-analyzer-* artifacts
#   test       all packages (collector, daemon/MCP, TUI, vitest-guard, verify) + CLI smoke test on
#              Linux / macOS / Windows with Node 22.22.2 (declared minimum: jsdom 31 needs ^22.22.2 || >=24.15), 22 and 24
#   odd-path   the same checkout under "Můj projekt ěš/" (space + diacritics) on 3 OS
#
# Policy
#   - a skipped test fails the job (ci.mjs; platform-specific skips are allow-listed there)
#   - actions are pinned by commit SHA; Rust comes from the runner's rustup with a pinned version
#     (no third-party action); installs are `npm ci --ignore-scripts` from lockfiles
#   - least privilege: read-only token, no credentials left in the checkout, no secrets used,
#     `pull_request` (never `pull_request_target`), no caches shared with fork PRs
#   - artifacts of this workflow are for inspection only; releases must be built from tags
name: vto-ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: vto-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  RUST_TOOLCHAIN: '1.97.0'          # edition 2024 needs >= 1.85; bump deliberately
  CARGO_TERM_COLOR: always
  NO_UPDATE_NOTIFIER: '1'
jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: node .github/scripts/ci.mjs lint

  analyzer:
    name: analyzer (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-gnu,  npm: linux-x64,    exe: vto }
          # arm64 Linux runners are free for public repositories only; in a private repository
          # remove this leg or point it at a self-hosted / larger runner
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, npm: linux-arm64,  exe: vto }
          - { os: macos-15,         target: aarch64-apple-darwin,      npm: darwin-arm64, exe: vto }
          # macos-13 is retired; macos-15-intel is the last x86_64 macOS image (until autumn 2027)
          - { os: macos-15-intel,   target: x86_64-apple-darwin,       npm: darwin-x64,   exe: vto }
          - { os: windows-2025,     target: x86_64-pc-windows-msvc,    npm: win32-x64,    exe: vto.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      VTO_CARGO_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Rust toolchain (pinned, from the runner's rustup)
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$VTO_CARGO_TARGET" --no-self-update
          rustup default "$RUST_TOOLCHAIN"
      - name: cargo test + release build
        run: node .github/scripts/ci.mjs analyzer
      - name: pack @jirikral/vto-analyzer-${{ matrix.npm }}
        run: node mcp/scripts/pack-analyzer.mjs --target ${{ matrix.target }} --npm ${{ matrix.npm }} --bin analyzer/target/${{ matrix.target }}/release/${{ matrix.exe }} --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: 'analyzer-${{ matrix.npm }}', path: dist/, retention-days: 7, if-no-files-found: error }

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        node: ['22', '24']
        include:
          - { os: ubuntu-24.04, node: '22.22.2' }    # engines.node lower bound (jsdom 31: ^22.22.2)
          - { os: windows-2025, node: '22.22.2' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ matrix.node }}' }
      - name: Rust toolchain (pinned, from the runner's rustup)
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
      # each leg builds its own analyzer: no leg waits for (or is blocked by) another platform
      - name: analyzer (release build for this platform)
        run: cargo build --locked --release --manifest-path analyzer/Cargo.toml
      - name: install (lockfiles, no install scripts)
        run: node .github/scripts/ci.mjs install
      - name: CLI smoke test (--help / --version of every entry point)
        run: node .github/scripts/ci.mjs tui smoke
      - name: collector (selftest, corpus, tests)
        if: ${{ !cancelled() }}
        run: node .github/scripts/ci.mjs collector
      - name: daemon + MCP
        if: ${{ !cancelled() }}
        run: node .github/scripts/ci.mjs mcp
      - name: vitest-guard
        if: ${{ !cancelled() }}
        run: node .github/scripts/ci.mjs vitest-guard
      - name: verify
        if: ${{ !cancelled() }}
        run: node .github/scripts/ci.mjs verify

  odd-path:
    name: path with a space and diacritics (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 'Můj projekt ěš/vto'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false, path: 'Můj projekt ěš/vto' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Rust toolchain (pinned, from the runner's rustup)
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
      - run: cargo build --locked --release --manifest-path analyzer/Cargo.toml
      - run: node .github/scripts/ci.mjs install
      - name: smoke + collector + verify end to end from this path
        run: node .github/scripts/ci.mjs oddpath
