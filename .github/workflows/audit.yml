# Supply-chain audit: known vulnerabilities in the Rust analyzer's crates (cargo audit, RustSec) and in the npm
# lockfiles (npm audit, runtime and dev dependencies). Runs weekly, on lockfile changes and by hand.
# Read-only: no secrets, no publishing.
name: audit

on:
  schedule:
    - cron: '17 5 * * 1'
  push:
    branches: [main]
    paths:
      - 'analyzer/Cargo.lock'
      - '**/package-lock.json'
      - '.github/workflows/audit.yml'
  pull_request:
    paths:
      - 'analyzer/Cargo.lock'
      - '**/package-lock.json'
      - '.github/workflows/audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.97.0'
  CARGO_AUDIT_VERSION: '0.23.0'

jobs:
  cargo-audit:
    name: cargo audit (analyzer)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Rust toolchain (pinned, from the runner's rustup)
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
      - name: Install cargo-audit (pinned, locked)
        run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
      - name: cargo audit
        # fails on any RustSec vulnerability; unmaintained/yanked crates are reported as warnings
        run: cargo audit --file analyzer/Cargo.lock

  npm-audit:
    name: npm audit (${{ matrix.dir }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: ['.', 'vitest-guard', 'mcp', 'tui', 'collector/corpus', 'bench/trial']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: npm audit (lockfile only, no install, no scripts)
        working-directory: ${{ matrix.dir }}
        # high and critical fail the job; lower severities are listed in the log
        run: npm audit --package-lock-only --audit-level=high
