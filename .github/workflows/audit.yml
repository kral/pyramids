# Supply-chain audit: known vulnerabilities in the npm lockfiles (npm audit, runtime and dev dependencies). Runs weekly, on lockfile changes and by hand.
# Read-only: no secrets, no publishing.
name: audit

on:
  schedule:
    - cron: '17 5 * * 1'
  push:
    branches: [main]
    paths:
      - '**/package-lock.json'
      - '.github/workflows/audit.yml'
  pull_request:
    paths:
      - '**/package-lock.json'
      - '.github/workflows/audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit (${{ matrix.dir }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: ['vitest-guard', 'bench/trial']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: npm audit (lockfile only, no install, no scripts)
        working-directory: ${{ matrix.dir }}
        # high and critical fail the job; lower severities are listed in the log
        run: npm audit --package-lock-only --audit-level=high
