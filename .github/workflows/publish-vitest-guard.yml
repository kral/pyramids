# Publish @jirikral/vitest-guard to npm (usable from npm, pnpm and yarn) with SLSA provenance.
#
# Trigger: push a tag `vitest-guard-v<version>` whose version equals vitest-guard/package.json.
# Safety: the publish job runs in the protected environment `npm-publish`. Nothing is published until
# a required reviewer approves the job in the GitHub UI.
# Two jobs (security review 3 S1, architecture review 3 S7/S8):
#   build   – no id-token: npm ci, the test suite on every OS, the committed setup bundle must be what the
#             sources produce, npm pack, the tarball installed into a fresh project (bin --version + a tiny
#             `check`), the tarball + its sha256 uploaded as an artifact.
#   publish – id-token: write, no checkout, no npm ci, no tests, no scripts: downloads exactly the tested
#             tarball, checks its sha256, name and version, and publishes it with provenance.
#
# One-time setup (repository Settings → Environments → New environment "npm-publish"):
#   1. Required reviewers: add yourself.   2. Deployment branches and tags: only tags `vitest-guard-v*`.
#   3. Environment variable PUBLISH_ENV_PROTECTED = yes   (the job refuses to run without it, so an
#      environment auto-created by GitHub without protection can never publish).
#   4. Auth, either:
#      a) npm trusted publishing (preferred, no token): on npmjs.com → package settings → Trusted
#         publisher → GitHub Actions, repository kral/vto, workflow publish-vitest-guard.yml,
#         environment npm-publish. (npm may require the package to exist first – see b.)
#      b) a granular npm token (publish-only, short expiry) as environment secret NPM_TOKEN, needed for
#         the first publish (the package must exist before a trusted publisher can be configured). Delete
#         it once trusted publishing works (then remove NODE_AUTH_TOKEN below and, on npmjs.com, set
#         "Require two-factor authentication and disallow tokens"). Trusted publishing needs npm CLI
#         >= 11.5.1 and Node >= 22.14 – the publish job checks both.
name: publish-vitest-guard

on:
  push:
    tags: ['vitest-guard-v*']
  # dry run: only the build job (tests on every OS, pack, install the tarball); nothing is published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # vitest-guard's own suite on every OS and the Node lower bound, then the packed tarball as users get it
    name: build vitest-guard (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        node: ['22.22.2', '24']
        # macOS arm64 hosted runners are capacity-limited (jobs "not acquired by Runner"): one macOS leg is enough
        # here; the Node lower bound on macOS is covered by ci and the trial pipeline.
        exclude:
          - { os: macos-15, node: '22.22.2' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ matrix.node }}' }
      - name: committed setup bundle is up to date
        working-directory: vitest-guard
        run: npm run check:bundle
      - name: npm ci + test
        working-directory: vitest-guard
        run: |
          npm ci --ignore-scripts
          npm test
      - name: vitest-guard suite on Vitest 4.1.8 (peer range >=4.1 <6; the lockfile has 5.1.1)
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.node == '24' }}
        working-directory: vitest-guard
        run: |
          npm install --no-save --ignore-scripts --legacy-peer-deps --no-audit --no-fund vitest@4.1.8
          npm test
          npm ci --ignore-scripts --no-audit --no-fund
      - name: the tests did not change what is published
        shell: bash
        run: |
          set -euo pipefail
          node vitest-guard/scripts/bundle-setup.mjs
          git diff --exit-code -- vitest-guard/
          test -z "$(git status --porcelain --untracked-files=all -- vitest-guard/src vitest-guard/bin vitest-guard/scripts)"
      - name: pack
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vg-pack"
          cd vitest-guard
          npm pack --dry-run
          tgz="$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/vg-pack" | tail -n 1)"
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
          cd "$RUNNER_TEMP/vg-pack"
          node -e "const c=require('crypto'),f=require('fs');f.writeFileSync(process.argv[1]+'.sha256',c.createHash('sha256').update(f.readFileSync(process.argv[1])).digest('hex')+'  '+process.argv[1]+'\n')" "$tgz"
          cat "$tgz.sha256"
      - name: smoke test of the tarball in a fresh project
        shell: bash
        env:
          TGZ: ${{ steps.pack.outputs.tgz }}
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/vg-smoke"
          mkdir -p "$P/test"
          cp bench/trial/package.json bench/trial/package-lock.json "$P/"
          cd "$P"
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/vg-pack/$TGZ"
          want="$(node -p "require('./node_modules/@jirikral/vitest-guard/package.json').name + ' ' + require('./node_modules/@jirikral/vitest-guard/package.json').version")"
          have="$(./node_modules/.bin/vitest-guard --version)"
          [ "$have" = "$want" ] || { echo "::error::vitest-guard --version printed '$have', expected '$want'"; exit 1; }
          printf '%s\n' "import { defineConfig } from 'vitest/config';" "import { defineVitestGuardConfig } from '@jirikral/vitest-guard';" \
            "export default defineVitestGuardConfig(defineConfig({ test: { include: ['test/**/*.test.mjs'], environment: 'node' } }));" > vitest.config.mjs
          printf '%s\n' "import { test, expect } from 'vitest';" "test('adds', () => { expect(1 + 1).toBe(2); });" > test/a.test.mjs
          printf '%s\n' "import { test, expect } from 'vitest';" "test('globals', () => { expect(typeof globalThis.structuredClone).toBe('function'); });" > test/b.test.mjs
          ./node_modules/.bin/vitest-guard check
          node --input-type=module -e "await import('@jirikral/vitest-guard'); await import('@jirikral/vitest-guard/envstore'); console.log('exports ok')"
      - name: upload the tested tarball
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.node == '24' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-guard-tarball
          path: |
            ${{ runner.temp }}/vg-pack/*.tgz
            ${{ runner.temp }}/vg-pack/*.tgz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/vitest-guard-v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write    # npm provenance + trusted publishing (OIDC)
    steps:
      # no checkout, no npm ci, no tests, no lifecycle scripts: nothing but npm itself runs with the OIDC token
      - name: environment must be protected
        if: ${{ vars.PUBLISH_ENV_PROTECTED != 'yes' }}
        run: |
          echo "::error::Environment npm-publish is not configured (see the header of this workflow). Refusing to publish."
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, registry-url: 'https://registry.npmjs.org' }
      - name: Node >= 22.14 and npm >= 11.5.1 (trusted publishing)
        shell: bash
        run: |
          set -euo pipefail
          node -e "const [a,b]=process.versions.node.split('.').map(Number); if (a<22||(a===22&&b<14)) { console.error('::error::Node '+process.version+' < 22.14'); process.exit(1) }"
          ok() { node -e "const v=process.argv[1].split('.').map(Number); process.exit(v[0]>11||(v[0]===11&&(v[1]>5||(v[1]===5&&v[2]>=1)))?0:1)" "$(npm --version)"; }
          if ! ok; then npm install -g --ignore-scripts --no-audit --no-fund npm@11.6.2; fi
          ok || { echo "::error::npm $(npm --version) < 11.5.1"; exit 1; }
          echo "node $(node --version), npm $(npm --version)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: vitest-guard-tarball, path: dist }
      - name: tarball checksum, name and tag match
        id: check
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tgzs=(*.tgz)
          [ "${#tgzs[@]}" = 1 ] || { echo "::error::expected exactly one tarball, found ${#tgzs[@]}"; exit 1; }
          tgz="${tgzs[0]}"
          sha256sum -c "$tgz.sha256"
          tar -xzOf "$tgz" package/package.json > pkg.json
          name="$(node -p "require('./pkg.json').name")"
          have="$(node -p "require('./pkg.json').version")"
          want="${GITHUB_REF_NAME#vitest-guard-v}"
          [ "$name" = "@jirikral/vitest-guard" ] || { echo "::error::unexpected package name $name"; exit 1; }
          [ "$want" = "$have" ] || { echo "::error::tag $GITHUB_REF_NAME does not match package.json version $have"; exit 1; }
          tag=latest; case "$have" in *-*) tag=next;; esac
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: publish with provenance
        working-directory: dist
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}   # first publish only; empty once the secret is deleted -> OIDC
          TGZ: ${{ steps.check.outputs.tgz }}
          DIST_TAG: ${{ steps.check.outputs.tag }}
        run: npm publish "./$TGZ" --provenance --access public --tag "$DIST_TAG" --ignore-scripts
